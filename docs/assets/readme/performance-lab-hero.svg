<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Performance Lab</title>
  <desc id="desc">Performance Lab. Choose the right model for the job, on the device that has to run it.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.52" stop-color="#1687FF"/>
      <stop offset="1" stop-color="#7B5CFF"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080A0D"/>
      <stop offset="1" stop-color="#141820"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#surface)"/>
  <rect x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="#303844" stroke-width="2"/>

  <g transform="translate(112 54) scale(.82)">
