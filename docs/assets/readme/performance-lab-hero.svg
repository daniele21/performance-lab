      <path d="M35 132A96 96 0 0 1 180 49" stroke-width="14"/>
      <path d="M74 214A96 96 0 0 0 221 132" stroke-width="14"/>
    </g>
    <g fill="url(#brand)">
      <circle cx="35" cy="132" r="10"/>
      <circle cx="180" cy="49" r="10"/>
      <circle cx="74" cy="214" r="10"/>
      <circle cx="221" cy="132" r="10"/>
      <rect x="72" y="103" width="18" height="58" rx="9"/>
      <rect x="98" y="84" width="18" height="96" rx="9"/>
      <rect x="124" y="64" width="18" height="136" rx="9"/>
      <rect x="150" y="84" width="18" height="96" rx="9"/>
      <rect x="176" y="103" width="18" height="58" rx="9"/>
    </g>
  </g>

  <text x="370" y="135" fill="#F4F6F8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">Performance Lab</text>
  <text x="372" y="188" fill="#A0A8B2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="500">Choose the right model for the job — on the device that has to run it.</text>
  <text x="372" y="236" fill="#7DD6E8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" letter-spacing="3">QUALITY · PERFORMANCE · RESOURCES</text>
