name: Repository validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  scope:
    name: Select validation profile
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.selector.outputs.profile }}
      reason: ${{ steps.selector.outputs.reason }}
      run_python: ${{ steps.selector.outputs.run_python }}
      run_frontend: ${{ steps.selector.outputs.run_frontend }}
      run_product_e2e: ${{ steps.selector.outputs.run_product_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: selector
        name: Resolve blast radius
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            args=(
              --base "${{ github.event.pull_request.base.sha }}"
              --head "${{ github.event.pull_request.head.sha }}"
              --github-output "$GITHUB_OUTPUT"
            )
            if [[ "${{ github.base_ref }}" == "main" ]]; then
              args+=(--promotion)
            fi
            python scripts/select_validation_profile.py "${args[@]}"
          else
            python scripts/select_validation_profile.py --full --github-output "$GITHUB_OUTPUT"
          fi

  validate:
    name: Python ${{ matrix.python-version }}
    needs: scope
    if: needs.scope.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install constrained package and development dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-constraints.txt -e ".[dev]"
      - name: Validate CI dependency snapshot
        run: python scripts/validate_ci_constraints.py requirements/ci-constraints.txt
      - name: Validate repository
        run: python scripts/validate.py

  frontend:
    name: Frontend (Node 24)
    needs: scope
    if: needs.scope.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Install frozen frontend dependencies
        run: npm --prefix frontend ci
      - name: Check frontend
        run: npm --prefix frontend run check
      - name: Test frontend
        run: npm --prefix frontend run test
      - name: Build frontend
        run: npm --prefix frontend run build

  product-e2e:
    name: Product E2E (Python 3.12)
    needs: scope
    if: needs.scope.outputs.run_product_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install constrained package and development dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-constraints.txt -e ".[dev]"
      - name: Validate CI dependency snapshot
        run: python scripts/validate_ci_constraints.py requirements/ci-constraints.txt
      - name: Run deterministic product acceptance workflow
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/e2e -v --tb=short 2>&1 | tee product-e2e.log
      - name: Upload product E2E failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-e2e-failure-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: product-e2e.log
          if-no-files-found: error
          retention-days: 7
