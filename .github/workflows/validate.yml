name: Repository validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install constrained package and development dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-constraints.txt -e ".[dev]"
      - name: Validate CI dependency snapshot
        run: python scripts/validate_ci_constraints.py requirements/ci-constraints.txt
      - name: Validate repository
        run: python scripts/validate.py

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Install frozen frontend dependencies
        run: npm --prefix frontend ci
      - name: Check frontend
        run: npm --prefix frontend run check
      - name: Test frontend
        run: npm --prefix frontend run test
      - name: Build frontend
        run: npm --prefix frontend run build

  product-e2e:
    name: Product E2E (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install constrained package and development dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-constraints.txt -e ".[dev]"
      - name: Validate CI dependency snapshot
        run: python scripts/validate_ci_constraints.py requirements/ci-constraints.txt
      - name: Run deterministic product acceptance workflow
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/e2e -v --tb=short 2>&1 | tee product-e2e.log
      - name: Upload product E2E failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-e2e-failure-log
          path: product-e2e.log
          if-no-files-found: error
          retention-days: 7
