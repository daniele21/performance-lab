name: Repository validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  scope:
    name: Select validation profile
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.selector.outputs.profile }}
      reason: ${{ steps.selector.outputs.reason }}
      run_python: ${{ steps.selector.outputs.run_python }}
      run_frontend: ${{ steps.selector.outputs.run_frontend }}
      run_product_e2e: ${{ steps.selector.outputs.run_product_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: selector
        name: Resolve blast radius
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            args=(
              --base "${{ github.event.pull_request.base.sha }}"
              --head "${{ github.event.pull_request.head.sha }}"
              --github-output "$GITHUB_OUTPUT"
            )
            if [[ "${{ github.base_ref }}" == "main" ]]; then
              args+=(--promotion)
            fi
            python scripts/select_validation_profile.py "${args[@]}"
          else
            python scripts/select_validation_profile.py --full --github-output "$GITHUB_OUTPUT"
          fi

  validate:
    name: Python ${{ matrix.python-version }}
    needs: scope
    if: needs.scope.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync locked Python environment
        run: uv sync --extra dev --locked
      - name: Validate repository
        run: uv run --extra dev --locked python scripts/validate.py

  frontend:
    name: Frontend (Node 24)
    needs: scope
    if: needs.scope.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frozen frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Check frontend
        run: pnpm --dir frontend run check
      - name: Test frontend
        run: pnpm --dir frontend run test
      - name: Build frontend
        run: pnpm --dir frontend run build

  product-e2e:
    name: Product E2E (Python 3.12)
    needs: scope
    if: needs.scope.outputs.run_product_e2e == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked Python environment
        run: uv sync --extra dev --locked
      - name: Run deterministic product acceptance workflow
        shell: bash
        run: |
          set -o pipefail
          uv run --extra dev --locked python -m pytest tests/e2e -v --tb=short 2>&1 | tee product-e2e.log
      - name: Upload product E2E failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-e2e-failure-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: product-e2e.log
          if-no-files-found: error
          retention-days: 7
