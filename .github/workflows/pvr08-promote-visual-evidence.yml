name: PVR-08 promote visual evidence

on:
  push:
    branches: [agent/pvr-08-visual-acceptance]
    paths:
      - ".engineering/pvr08-promotion.json"

permissions:
  contents: write
  actions: read

jobs:
  promote:
    name: Promote reviewed bounded visual evidence
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify reviewed artifact and promote exact files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import tempfile

          root = pathlib.Path.cwd()
          config = json.loads(
              (root / ".engineering" / "pvr08-promotion.json").read_text(encoding="utf-8")
          )
          repo = os.environ["GITHUB_REPOSITORY"]
          artifact_id = int(config["artifact_id"])
          artifact_name = config["artifact_name"]
          run_id = int(config["workflow_run_id"])

          remote_digest = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/actions/artifacts/{artifact_id}", "--jq", ".digest"],
              text=True,
          ).strip()
          expected_artifact_digest = f"sha256:{config['artifact_sha256']}"
          if remote_digest != expected_artifact_digest:
              raise SystemExit(
                  f"artifact metadata digest mismatch: expected {expected_artifact_digest}, got {remote_digest}"
              )

          expected_hashes = config["files"]
          expected_names = sorted(expected_hashes)
          with tempfile.TemporaryDirectory(prefix="pvr08-") as temp_dir:
              capture = pathlib.Path(temp_dir) / "capture"
              capture.mkdir()
              subprocess.run(
                  [
                      "gh",
                      "run",
                      "download",
                      str(run_id),
                      "--repo",
                      repo,
                      "--name",
                      artifact_name,
                      "--dir",
                      str(capture),
                  ],
                  check=True,
              )

              actual_names = sorted(path.name for path in capture.rglob("*.png"))
              if actual_names != expected_names:
                  raise SystemExit(
                      f"bounded capture mismatch: expected {expected_names}, got {actual_names}"
                  )

              captured: dict[str, pathlib.Path] = {}
              for name in expected_names:
                  matches = list(capture.rglob(name))
                  if len(matches) != 1:
                      raise SystemExit(f"expected exactly one {name}, found {len(matches)}")
                  digest = hashlib.sha256(matches[0].read_bytes()).hexdigest()
                  if digest != expected_hashes[name]:
                      raise SystemExit(
                          f"{name} digest mismatch: expected {expected_hashes[name]}, got {digest}"
                      )
                  captured[name] = matches[0]

              stage = config["stage"]
              if stage == "target":
                  destination = (
                      root
                      / "design"
                      / "reference"
                      / "visual-targets"
                      / "desktop-standard-v0.6"
                  )
                  destination.mkdir(parents=True, exist_ok=True)
                  for name, source in captured.items():
                      shutil.copyfile(source, destination / name)
                  manifest = {
                      "schema_version": 1,
                      "target_type": "approved-design-target",
                      "target_set_version": "0.6.0",
                      "status": "approved-bounded-v0.6-target",
                      "viewport": {"width": 1536, "height": 960, "class": "desktop-standard"},
                      "source_of_truth": "design/ux-contract.json",
                      "brand_source": "design/brand-kit.json",
                      "capture": {
                          "source_head_sha": config["source_head_sha"],
                          "workflow_run_id": run_id,
                          "artifact_id": artifact_id,
                          "artifact_name": artifact_name,
                          "artifact_sha256": config["artifact_sha256"],
                          "platform": "GitHub-hosted Ubuntu 24.04",
                          "locale": "en-US",
                          "timezone": "UTC",
                          "color_scheme": "dark",
                          "reduced_motion": "reduce",
                      },
                      "review": {
                          "method": "manual visual inspection of the exact bounded CI capture against the v0.6 brand and UX contracts",
                          "decision": "approved as bounded v0.6 design target",
                          "human_reference_grade_claim": False,
                      },
                      "targets": {
                          name.removesuffix(".png"): {
                              "file": name,
                              "sha256": expected_hashes[name],
                              "status": "approved-v0.6-design-target",
                          }
                          for name in expected_names
                      },
                      "scope_note": "Only these five stable surfaces are approved as v0.6 visual targets. Broader J0-J9 screenshot/trace evidence remains owned by PRE_REAL.",
                  }
                  manifest_path = destination / "manifest.json"
                  manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
                  expected_paths = {
                      str((destination / name).relative_to(root)) for name in expected_names
                  } | {str(manifest_path.relative_to(root))}
              elif stage == "golden":
                  target_manifest_path = (
                      root
                      / "design"
                      / "reference"
                      / "visual-targets"
                      / "desktop-standard-v0.6"
                      / "manifest.json"
                  )
                  if not target_manifest_path.exists():
                      raise SystemExit("v0.6 target manifest must exist before golden promotion")
                  target_manifest = json.loads(target_manifest_path.read_text(encoding="utf-8"))
                  for name in expected_names:
                      target_sha = target_manifest["targets"][name.removesuffix(".png")]["sha256"]
                      if expected_hashes[name] != target_sha:
                          raise SystemExit(
                              f"second capture {name} does not match approved target: "
                              f"{expected_hashes[name]} != {target_sha}"
                          )

                  destination = root / "design" / "reference" / "visual-goldens" / "desktop-standard"
                  for name, source in captured.items():
                      shutil.copyfile(source, destination / name)
                  manifest_path = destination / "manifest.json"
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                  manifest["status"] = "approved-v0.6-automated-visual-regression-baseline"
                  manifest["capture"] = {
                      "source_head_sha": config["source_head_sha"],
                      "browser_capture_run_id": run_id,
                      "artifact_id": artifact_id,
                      "artifact_name": artifact_name,
                      "artifact_sha256": config["artifact_sha256"],
                      "platform": "GitHub-hosted Ubuntu 24.04",
                      "locale": "en-US",
                      "timezone": "UTC",
                      "color_scheme": "dark",
                      "reduced_motion": "reduce",
                  }
                  manifest["review"] = {
                      "method": "second independent CI capture matched byte-for-byte against the approved bounded v0.6 target set",
                      "decision": "accepted for bounded automated visual regression",
                      "human_reference_grade_claim": False,
                  }
                  manifest["design_target_root"] = (
                      "design/reference/visual-targets/desktop-standard-v0.6"
                  )
                  manifest["goldens"] = {
                      name.removesuffix(".png"): {
                          "file": name,
                          "sha256": expected_hashes[name],
                      }
                      for name in expected_names
                  }
                  manifest["scope_note"] = (
                      "These five stable surfaces are v0.6 automated visual-regression goldens. "
                      "They do not substitute for PRE_REAL J0-J9 or final human accessibility/usability review."
                  )
                  manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
                  expected_paths = {
                      str((destination / name).relative_to(root)) for name in expected_names
                  } | {str(manifest_path.relative_to(root))}
              else:
                  raise SystemExit(f"unsupported promotion stage: {stage}")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True,
          )
          subprocess.run(["git", "add", "design/reference"], check=True)
          changed = set(
              subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True)
              .strip()
              .splitlines()
          )
          if changed != expected_paths:
              raise SystemExit(
                  f"promotion diff escaped bounded scope: expected {sorted(expected_paths)}, got {sorted(changed)}"
              )
          subprocess.run(
              ["git", "commit", "-m", f"design: promote PVR-08 {config['stage']} evidence"],
              check=True,
          )
          subprocess.run(["git", "push", "origin", "HEAD:agent/pvr-08-visual-acceptance"], check=True)
          PY
