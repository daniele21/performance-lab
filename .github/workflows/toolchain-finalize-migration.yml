name: Finalize uv and pnpm migration

on:
  push:
    branches: [agent/toolchain-uv-pnpm-howto]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update remaining toolchain owners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(rel: str, old: str, new: str) -> None:
              path = Path(rel)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing expected text in {rel}: {old}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace("scripts/select_validation_profile.py", '    "requirements/ci-constraints.txt",\n', '    "uv.lock",\n    ".python-version",\n')
          replace("scripts/select_validation_profile.py", '    "frontend/package-lock.json",\n', '    "frontend/pnpm-lock.yaml",\n')
          replace("scripts/select_validation_profile.py", '    "scripts/validate_ci_constraints.py",\n', '')
          replace(
              "scripts/select_validation_profile.py",
              '        path.startswith(("src/", "tests/", "scripts/", "requirements/")) or path == "pyproject.toml"\n',
              '        path.startswith(("src/", "tests/", "scripts/"))\n        or path in {"pyproject.toml", "uv.lock", ".python-version"}\n',
          )
          replace("tests/test_release_artifacts.py", "frontend/package-lock.json", "frontend/pnpm-lock.yaml")
          replace("frontend/playwright.config.ts", "npm run build && npm run preview", "pnpm run build && pnpm run preview")
          replace("frontend/playwright.pre-real.config.ts", "npm run build && npm run preview", "pnpm run build && pnpm run preview")
          replace("frontend/.prettierignore", "package-lock.json", "pnpm-lock.yaml")
          replace("frontend/README.md", "committed `package-lock.json`", "committed `pnpm-lock.yaml`")
          replace(
              ".engineering/README.md",
              "Use the native Python/npm commands declared in `commands.json` rather than inventing parallel wrappers. `frontend/package-lock.json` is the frozen browser dependency source and `requirements/ci-constraints.txt` is the constrained Python CI source.",
              "Use the canonical `uv`/`pnpm` commands declared in `commands.json` rather than inventing parallel wrappers. `uv.lock` is the locked Python project environment and `frontend/pnpm-lock.yaml` is the frozen browser dependency source; local Python execution is isolated in the repository-owned `.venv` managed by `uv`.",
          )
          replace(
              "docs/ci-regression.md",
              '- uses: actions/setup-python@v5\n  with:\n    python-version: "3.12"\n\n- run: python -m pip install -e .',
              '- uses: astral-sh/setup-uv@v6\n  with:\n    version: "0.12.5"\n    python-version: "3.12"\n\n- run: uv sync --locked\n\n- run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"',
          )
          PY
          rm requirements/ci-constraints.txt
          rm scripts/validate_ci_constraints.py
      - name: Show remaining legacy dependency-manager references
        shell: bash
        run: |
          grep -RInE '\bnpm\b|pip install|package-lock\.json|ci-constraints\.txt|validate_ci_constraints' \
            --exclude-dir=.git --exclude='pnpm-lock.yaml' --exclude='uv.lock' . || true
      - name: Commit finalized migration owners
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize uv and pnpm toolchain ownership'
          git push origin HEAD:agent/toolchain-uv-pnpm-howto
