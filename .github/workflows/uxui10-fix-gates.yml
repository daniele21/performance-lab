name: UXUI-10 fix deterministic gates

on:
  push:
    branches: [agent/uxui-final-acceptance]
    paths:
      - .github/workflows/uxui10-fix-gates.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uxui-final-acceptance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Install frozen frontend dependencies
        run: npm --prefix frontend ci
      - name: Restore adopted contract version and format visual spec
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('design/ux-contract.json')
          text = path.read_text()
          old = '"contract_version": "0.5.1"'
          new = '"contract_version": "0.5.0"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old}')
          path.write_text(text.replace(old, new, 1))
          PY
          npm --prefix frontend exec -- prettier --write e2e/visual-acceptance.spec.ts
          rm .github/workflows/uxui10-fix-gates.yml
          git diff --check
      - name: Commit owner-level fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/ux-contract.json frontend/e2e/visual-acceptance.spec.ts .github/workflows/uxui10-fix-gates.yml
          git commit -m "Fix UXUI-10 adopted contract and formatting"
          git push origin HEAD:agent/uxui-final-acceptance
