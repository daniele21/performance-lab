name: Temporary Playwright lockfile generator

on:
  push:
    branches: [test/e2e-ui-playwright]

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/e2e-ui-playwright
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.17.0
      - name: Pin Playwright and update frozen lockfile
        run: npm --prefix frontend install --save-dev --package-lock-only @playwright/test@1.62.1
      - name: Commit generated dependency metadata
        shell: bash
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "Pin Playwright 1.62.1"
          git push origin HEAD:test/e2e-ui-playwright
