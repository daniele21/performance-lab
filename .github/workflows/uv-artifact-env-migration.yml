name: Migrate artifact test environments to uv

on:
  push:
    branches: [agent/toolchain-uv-pnpm-howto]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Replace temporary venv pip ownership with uv
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for rel in ("scripts/full_product_e2e.py", "scripts/smoke_release.py"):
              path = Path(rel)
              text = path.read_text(encoding="utf-8")
              text = text.replace("import venv\n", "")
              old_venv = "    venv.EnvBuilder(with_pip=True, system_site_packages=True, clear=True).create(environment)\n"
              if old_venv not in text:
                  raise SystemExit(f"missing venv owner in {rel}")
              text = text.replace(
                  old_venv,
                  "    subprocess.run(\n"
                  "        [\"uv\", \"venv\", \"--python\", sys.executable, \"--system-site-packages\", str(environment)],\n"
                  "        check=True,\n"
                  "        text=True,\n"
                  "        capture_output=True,\n"
                  "    )\n",
              )
              if rel.endswith("full_product_e2e.py"):
                  old_install = '''    subprocess.run(\n        [str(python), "-m", "pip", "install", "--no-deps", str(wheels[0])],\n        check=True,\n        text=True,\n        capture_output=True,\n    )\n'''
                  new_install = '''    subprocess.run(\n        ["uv", "pip", "install", "--python", str(python), "--no-deps", str(wheels[0])],\n        check=True,\n        text=True,\n        capture_output=True,\n    )\n'''
              else:
                  old_install = '''        subprocess.run(\n            [str(python), "-m", "pip", "install", "--no-deps", str(wheel)],\n            check=True,\n            text=True,\n            capture_output=True,\n        )\n'''
                  new_install = '''        subprocess.run(\n            ["uv", "pip", "install", "--python", str(python), "--no-deps", str(wheel)],\n            check=True,\n            text=True,\n            capture_output=True,\n        )\n'''
              if old_install not in text:
                  raise SystemExit(f"missing pip install owner in {rel}")
              text = text.replace(old_install, new_install)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit uv artifact environment ownership
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/full_product_e2e.py scripts/smoke_release.py
          git commit -m 'Use uv for packaged artifact test environments'
          git push origin HEAD:agent/toolchain-uv-pnpm-howto
