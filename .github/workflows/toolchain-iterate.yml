name: Iterate uv pnpm toolchain migration

on:
  push:
    branches: [agent/toolchain-uv-pnpm-howto]

permissions:
  contents: write

jobs:
  iterate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Sync locked environments
        run: |
          uv sync --extra dev --locked
          pnpm --dir frontend install --frozen-lockfile
      - name: Format changed executable owners
        run: |
          uv run --extra dev --locked ruff format \
            scripts/doctor.py \
            scripts/full_product_e2e.py \
            scripts/package_release.py \
            scripts/pre_real_e2e.py \
            scripts/select_validation_profile.py \
            scripts/smoke_release.py \
            scripts/verify_toolchain.py \
            tests/test_release_artifacts.py
          pnpm --dir frontend exec prettier --write \
            package.json \
            playwright.config.ts \
            playwright.pre-real.config.ts \
            AGENTS.md \
            README.md
      - name: Run narrow migration checks
        run: |
          uv run --extra dev --locked ruff check \
            scripts/doctor.py \
            scripts/full_product_e2e.py \
            scripts/package_release.py \
            scripts/pre_real_e2e.py \
            scripts/select_validation_profile.py \
            scripts/smoke_release.py \
            scripts/verify_toolchain.py \
            tests/test_release_artifacts.py
          uv run --extra dev --locked python scripts/verify_toolchain.py
          pnpm --dir frontend run check
      - name: Commit formatter output if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply canonical toolchain formatting'
          git push origin HEAD:agent/toolchain-uv-pnpm-howto
