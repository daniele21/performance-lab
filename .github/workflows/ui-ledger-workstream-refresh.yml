name: Refresh UI workstream ledger

on:
  push:
    branches: [agent/ui-state-ledger-refresh]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh UI productization task states
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/workstreams/ui-productization.md')
          text = path.read_text()
          replacements = {
              '| UIA-001 versioned local application API + UI read models | READY |': '| UIA-001 versioned local application API + UI read models | DONE |',
              '| UIA-002 run lifecycle + progress | PLANNED |': '| UIA-002 run lifecycle + progress | DONE |',
              '| UIK-001 semantic design tokens + canonical primitives | READY |': '| UIK-001 semantic design tokens + canonical primitives | DONE |',
              '| UI-001 Overview / tested models | PLANNED |': '| UI-001 Overview / tested models | DONE |',
              '| UI-002 Runs + Run Detail | PLANNED |': '| UI-002 Runs + Run Detail | DONE |',
              '| UI-003 Test a model | PLANNED |': '| UI-003 Test a model | DONE |',
              '| UI-004 Live Run + recovery | PLANNED |': '| UI-004 Live Run + recovery | DONE |',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing workstream row anchor: {old}')
              text = text.replace(old, new, 1)

          anchor = '| UIA-002 run lifecycle + progress | DONE | UIA-001 | bounded job ownership, SSE progress, cancellation, terminal recovery and restart semantics |\n'
          addition = '| UIA-003 executable local UI composition root | DONE | UIA-001, UIA-002, UI-003, UI-004 | `performance-lab-ui` loopback entrypoint wires store/query/job manager/FastAPI; frozen preflight inherits versioned local execution template; Vite proxies `/api` locally |\n'
          if anchor not in text:
              raise SystemExit('UIA-002 completed row not found for UIA-003 insertion')
          if 'UIA-003 executable local UI composition root' not in text:
              text = text.replace(anchor, anchor + addition, 1)

          old = '''The highest-value implementation parallelism now is:\n\n- **backend lane:** `UIA-001 -> UIA-002`;\n- **design-system lane:** `UIK-001`;\n- after the first stable API + primitives slice, **read-only product lane:** `UI-001` and `UI-002` can run in parallel;\n- `UI-003` can proceed in parallel once the write/config contracts needed by Test a model are explicit;\n- `UI-004` depends on both lifecycle and Test a model;\n- `UI-005` depends primarily on Run Detail/comparison read models.\n'''
          new = '''The highest-value implementation parallelism now is:\n\n- **primary product lane:** `UI-005` compatibility-first Compare;\n- **secondary product lane:** `UI-006` Library + Settings can proceed independently against the integrated read/config API;\n- **acceptance lane:** `E2E-UI-001` can begin browser coverage for the already integrated Overview -> Test a model -> Live Run -> Run Detail path while Compare/Library are completed;\n- **real-evidence lane:** execute representative Local LLM Server model/device runs in parallel with UI completion;\n- `REL-UI-001` remains after browser behavior stabilizes and owns final static assets/process/start-stop-clean lifecycle.\n'''
          if old not in text:
              raise SystemExit('parallel execution intent anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git rm .github/workflows/ui-ledger-workstream-refresh.yml
      - name: Commit refreshed workstream
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/workstreams/ui-productization.md
          git commit -m "docs: refresh UI productization DAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
