name: Update sample evidence golden

on:
  push:
    branches:
      - fix/sample-evidence-clarity

permissions:
  contents: write

jobs:
  update-golden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sample-evidence-clarity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frozen frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Regenerate visual snapshots
        run: pnpm --dir frontend exec playwright test e2e/visual-acceptance.spec.ts --update-snapshots
      - name: Commit inspected sample evidence golden
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add design/reference/visual-goldens/desktop-standard/sample-evidence-detail.png
          if git diff --cached --quiet; then
            echo "Golden already current"
            exit 0
          fi
          git commit -m "Update sample evidence visual golden"
          git push origin HEAD:fix/sample-evidence-clarity
