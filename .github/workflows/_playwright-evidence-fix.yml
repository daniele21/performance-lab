name: Temporary Playwright evidence fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/e2e-ui-playwright
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.17.0
      - run: npm --prefix frontend ci
      - name: Apply evidence-backed locator fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/e2e/critical-journeys.spec.ts')
          text = path.read_text()
          replacements = {
              'page.getByText("fp-run-candidate")': 'page.getByText("fp-run-candidate", { exact: true })',
              'page.getByLabel("Baseline")': 'page.locator("#select-baseline")',
              'page.getByLabel("Candidate")': 'page.locator("#select-candidate")',
              'expect(transitionDuration).toBe("0s");': 'expect(Number.parseFloat(transitionDuration)).toBeLessThanOrEqual(0.00001);',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f'missing expected source fragment: {before}')
              text = text.replace(before, after)
          path.write_text(text)
          PY
          npm --prefix frontend exec prettier -- --write e2e/critical-journeys.spec.ts
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/critical-journeys.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix Playwright acceptance locators"
          git push origin HEAD:test/e2e-ui-playwright
