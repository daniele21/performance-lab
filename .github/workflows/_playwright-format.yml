name: Temporary Playwright formatter

on:
  push:
    branches: [test/e2e-ui-playwright]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/e2e-ui-playwright
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.17.0
      - run: npm --prefix frontend ci
      - name: Apply canonical Prettier output
        run: npm --prefix frontend exec prettier -- --write e2e/critical-journeys.spec.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- frontend/e2e/critical-journeys.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/critical-journeys.spec.ts
          git commit -m "Format Playwright critical journeys"
          git push origin HEAD:test/e2e-ui-playwright
