name: Temporary light-first provenance finalizer

on:
  push:
    branches:
      - feat/desktop-ux-hierarchy

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/desktop-ux-hierarchy

      - name: Align canonical product-experience owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected fragment missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'design/ux-contract.json',
              '        "Devices / targets",\n        "Evidence retention",',
              '        "Devices / targets",\n        "Appearance",\n        "Evidence retention",',
          )
          replace_once(
              'design/ux-contract.json',
              '        "Devices / targets",\n        "Evidence retention",\n        "Accessibility",\n        "Advanced"\n      ],\n      "rules": [',
              '        "Devices / targets",\n        "Appearance",\n        "Evidence retention",\n        "Accessibility",\n        "Advanced"\n      ],\n      "rules": [',
          )
          replace_once(
              'design/ux-contract.json',
              '        "model connections configure endpoint discovery and credentials safely",\n',
              '        "model connections configure endpoint discovery and credentials safely",\n        "appearance preference is browser-local: Light is the canonical default, Dark is optional and System follows the operating system",\n',
          )

          replace_once(
              'design/README.md',
              '- **Devices / targets**\n- **Evidence retention**',
              '- **Devices / targets**\n- **Appearance** — Light is the canonical default; Dark is optional; System follows the operating system. The preference is browser-local and does not change benchmark/runtime semantics.\n- **Evidence retention**',
          )
          replace_once(
              'design/README.md',
              'Only expose product-owned configuration. Do not invent email notifications, telemetry controls, runtime lifecycle toggles or other settings merely because a mockup has space for them.',
              'Only expose product-owned configuration. Appearance is a browser-local UI preference: Light is the canonical reference, Dark remains optional and System follows the OS. Theme choice must not alter benchmark semantics, evidence truthfulness or runtime ownership. Do not invent email notifications, telemetry controls, runtime lifecycle toggles or other settings merely because a mockup has space for them.',
          )

          ws = Path('docs/workstreams/product-ux-ui-convergence.md')
          text = ws.read_text()
          old = '- **Library / Settings:** quieter secondary surfaces preserve backend/runtime ownership boundaries.\n'
          new = old + '- **Visual theme:** Light is the canonical default workspace; Dark remains an explicit optional preference and System follows the OS. The browser-local theme preference changes presentation only and does not alter benchmark, evidence or runtime semantics.\n'
          if old not in text:
              raise SystemExit('workstream settled-direction anchor missing')
          text = text.replace(old, new, 1)

          start = text.index('## Refreshed automated evidence\n')
          end = text.index('\n## PVR-11 acceptance gate\n', start)
          refreshed = (
              '## Refreshed automated evidence\n\n'
              'The PVR-10 product tree first passed the repository-owned deterministic frontend gates, packaged-product workflow and complete browser journey suite for the four-stage hierarchy. Representative-human visual feedback then changed the canonical visual direction from dark-first to **Light-first** while preserving the settled task model and evidence semantics.\n\n'
              'The Light-first implementation is owned by `design/brand-kit.json` plus the executable semantic tokens. Light remains the default even when the OS is dark; Dark is opt-in; System follows `prefers-color-scheme`. `Settings -> Appearance` stores only this UI preference in the browser.\n\n'
              'All five stable implementation goldens were recaptured from the real Playwright implementation in bounded run `33649543902`; the exact-scope guard required all and only Overview, Test a model Review, Benchmark Detail, Sample Evidence Detail and Campaign Results to change. Candidate artifact `9854232790` (`light-first-golden-candidate-33649543902-1`) was captured at 1536x960 with OS color scheme dark, reduced motion enabled and the product still rendering its canonical Light default. The retained captures were agent-inspected with no blocking visual regression.\n\n'
              'Independent Browser Acceptance run `33649979498` then reproduced the committed Light baseline **without snapshot updates** while passing the complete browser journey suite, the Appearance contract and required screenshot/video verification. Artifact `9854404103` (`browser-acceptance-evidence-33649979498-1`) retains that evidence. Repository Validation `33649979311` and Repository Health `33649979374` also passed on the same head.\n\n'
              'Built Product run `33649979282` passed Python/frontend validation, deterministic product journey, PRE_REAL browser J0-J9 plus media verification, build/smoke, packaged J0/J1/J8/J9 plus media verification, readiness finalization and operating/E2E contract enforcement. Retained artifacts are built product `9854434372`, PRE_REAL `9854435657` and packaged E2E `9854436741`.\n\n'
              '`design/reference/visual-goldens/desktop-standard/manifest.json` owns the capture and independent-acceptance provenance. The approved automated baseline deliberately keeps `human_reference_grade_claim` false.\n\n'
              'Because this provenance/documentation edit changes the exact branch head after those runs, one final exact-head automated confirmation is still required. It does not replace representative-human accessibility/usability review.\n'
          )
          text = text[:start] + refreshed + text[end:]
          ws.write_text(text)

          manifest_path = Path('design/reference/visual-goldens/desktop-standard/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['status'] = 'approved-light-first-automated-visual-regression-baseline'
          manifest['acceptance'] = {
              'browser_acceptance_run_id': 33649979498,
              'artifact_id': 9854404103,
              'artifact_name': 'browser-acceptance-evidence-33649979498-1',
              'artifact_sha256': '24b69d3a192424d7527388efe389e7c34c4af44991117ca49e1c27b9ddb83923',
              'result': 'all browser journeys, Appearance contract, media verification and visual regression passed without snapshot updates',
          }
          manifest['review'] = {
              'method': 'agent-inspected real Playwright implementation captures followed by independent Browser Acceptance reproduction without snapshot updates',
              'decision': 'accepted for bounded automated visual regression',
              'human_reference_grade_claim': False,
          }
          manifest['scope_note'] = (
              'These five stable automated visual-regression surfaces were refreshed from the real implementation after Light became the canonical default theme. '
              'Capture intentionally used an OS-dark browser context while the product rendered Light, proving that default product appearance is independent of OS theme until the user selects System. '
              'Independent Browser Acceptance reproduced the committed baseline without snapshot updates. This does not substitute for representative-human accessibility/usability review.'
          )
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          json.loads(Path('design/ux-contract.json').read_text())
          json.loads(manifest_path.read_text())
          PY

      - name: Guard documentation-only scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            design/README.md \
            design/reference/visual-goldens/desktop-standard/manifest.json \
            design/ux-contract.json \
            docs/workstreams/product-ux-ui-convergence.md | sort)"
          echo "$changed"
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected provenance-finalization scope" >&2
            exit 1
          fi

      - name: Commit canonical provenance and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-finalize-light-docs.yml
          git add design/README.md design/ux-contract.json docs/workstreams/product-ux-ui-convergence.md design/reference/visual-goldens/desktop-standard/manifest.json
          git commit -m "Finalize light-first UX provenance"
          git push origin HEAD:feat/desktop-ux-hierarchy
