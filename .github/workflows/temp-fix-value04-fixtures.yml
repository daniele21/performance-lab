name: Temporary VALUE-04 fixture repair

on:
  push:
    branches:
      - feat/value-04b-resource-projection

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/value-04b-resource-projection
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Update mocked API payloads to VALUE-04 read model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          helper_identity = '''const unavailableResources = {\n  ...API_IDENTITY,\n  state: "unavailable",\n  measurements: [],\n  note: "No policy-eligible model-resource evidence is retained for this fixture.",\n} as const;\n'''
          path = Path("frontend/e2e/best-setup-ux.spec.ts")
          text = path.read_text()
          anchor = 'const API_IDENTITY = { api_version: "v1", read_model_version: 1 } as const;\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + helper_identity, 1)
          for metric in ('qualityMetric(1)', 'qualityMetric(0.5)'):
              old = f'      metrics: [{metric}],\n'
              assert text.count(old) == 1
              text = text.replace(old, old + '      resources: unavailableResources,\n', 1)
          path.write_text(text)

          helper_api = '''const unavailableResources = {\n  ...API,\n  state: "unavailable",\n  measurements: [],\n  note: "No policy-eligible model-resource evidence is retained for this fixture.",\n} as const;\n'''
          path = Path("frontend/e2e/case-comparison-ux.spec.ts")
          text = path.read_text()
          anchor = 'const API = { api_version: "v1", read_model_version: 1 } as const;\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + helper_api, 1)
          old = '    metrics: [metric(value)],\n'
          assert text.count(old) == 1
          text = text.replace(old, old + '    resources: unavailableResources,\n', 1)
          old = '      unavailable_reason: null,\n'
          assert text.count(old) == 3
          text = text.replace(old, '      resources: unavailableResources,\n' + old)
          path.write_text(text)

          path = Path("frontend/e2e/product-hardening.spec.ts")
          text = path.read_text()
          anchor = 'const API = { api_version: "v1", read_model_version: 1 } as const;\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + helper_api, 1)
          old = '    evidence: sampleEvidence(runId, modelId, index),\n'
          assert text.count(old) == 1
          text = text.replace(old, old + '    resources: unavailableResources,\n', 1)
          path.write_text(text)
          PY
      - run: pnpm --dir frontend exec prettier e2e/best-setup-ux.spec.ts e2e/case-comparison-ux.spec.ts e2e/product-hardening.spec.ts --write
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/temp-fix-value04-fixtures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/best-setup-ux.spec.ts frontend/e2e/case-comparison-ux.spec.ts frontend/e2e/product-hardening.spec.ts
          git commit -m "test: align VALUE-04 browser fixtures"
          git push origin HEAD:feat/value-04b-resource-projection
