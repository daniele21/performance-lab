name: Temporary VALUE-08C formatter

on:
  push:
    branches:
      - feat/value-08c-distributed-artifact-acceptance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/value-08c-distributed-artifact-acceptance
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.5
          python-version: "3.12"
      - run: uvx ruff@0.16.5 format scripts/full_product_e2e.py
      - name: Commit canonical formatting and remove temporary workflow
        run: |
          git rm .github/workflows/temp-format-value08c.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/full_product_e2e.py
          git commit -m "style: format VALUE-08C harness"
          git push origin HEAD:feat/value-08c-distributed-artifact-acceptance
