name: UXUI-10 finalize text

on:
  push:
    branches: [agent/uxui-final-acceptance]
    paths:
      - .github/workflows/uxui10-finalize-text.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uxui-final-acceptance
          fetch-depth: 0
      - name: Apply assertive UXUI-10 finalization patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          spec = Path("frontend/e2e/visual-acceptance.spec.ts")
          text = spec.read_text()
          old_import = 'import { expect, test, type Page, type Route, type TestInfo } from "@playwright/test";'
          if text.count(old_import) != 1:
              raise SystemExit("visual spec import did not match expected bootstrap state")
          text = text.replace(old_import, 'import { expect, test, type Page, type Route } from "@playwright/test";', 1)

          old_capture = '''async function capture(page: Page, testInfo: TestInfo, name: string) {
            await page.screenshot({
              path: testInfo.outputPath("visual-acceptance", `${name}.png`),
              animations: "disabled",
              caret: "hide",
            });
          }'''
          new_capture = '''async function matchGolden(page: Page, name: string) {
            await expect(page).toHaveScreenshot(`${name}.png`, {
              animations: "disabled",
              caret: "hide",
            });
          }'''
          if text.count(old_capture) != 1:
              raise SystemExit("visual spec capture helper did not match expected bootstrap state")
          text = text.replace(old_capture, new_capture, 1)

          old_test = '''test("UXUI-10 bootstrap captures the accepted implementation candidates", async ({
            page,
          }, testInfo) => {'''
          new_test = '''test("UXUI-10: stable target-backed surfaces match accepted implementation goldens", async ({
            page,
          }) => {'''
          if text.count(old_test) != 1:
              raise SystemExit("visual spec test declaration did not match expected bootstrap state")
          text = text.replace(old_test, new_test, 1)
          text = text.replace('await capture(page, testInfo, "', 'await matchGolden(page, "')
          if text.count('await matchGolden(page, "') != 5:
              raise SystemExit("visual spec expected exactly five golden assertions")

          sentinel = '''\n  throw new Error(\n    "UXUI-10 bootstrap only: review these exact implementation screenshots before accepting them as visual-regression goldens.",\n  );'''
          if text.count(sentinel) != 1:
              raise SystemExit("visual spec sentinel did not match expected bootstrap state")
          text = text.replace(sentinel, "", 1)
          if "testInfo" in text or "UXUI-10 bootstrap only" in text:
              raise SystemExit("visual spec still contains bootstrap-only state")
          spec.write_text(text)

          replace_once(
              "frontend/playwright.config.ts",
              '  outputDir: "test-results",\n',
              '  outputDir: "test-results",\n  snapshotPathTemplate: "../design/reference/visual-goldens/desktop-standard/{arg}{ext}",\n',
          )

          contract_path = Path("design/ux-contract.json")
          contract = json.loads(contract_path.read_text())
          if contract.get("contract_version") != "0.5.0":
              raise SystemExit("unexpected UX contract version")
          policy = contract.get("visual_target_policy", {})
          if policy.get("status") != "pending_final_ux_aligned_targets":
              raise SystemExit("unexpected visual target policy status")
          contract["contract_version"] = "0.5.1"
          policy["status"] = "approved_targets_with_initial_implementation_goldens"
          policy["implementation_golden_root"] = "design/reference/visual-goldens/desktop-standard/"
          policy["implementation_golden_scope"] = "limited stable high-value target-backed surfaces with exact build/source provenance; not a substitute for semantic, accessibility or representative-user acceptance"
          contract["validation"]["visual_regression"] = "CI compares the limited stable high-value implementation-golden set after semantic journey coverage; manual accessibility/usability evidence remains a separate reference-grade gate"
          contract_path.write_text(json.dumps(contract, indent=2) + "\n")

          replace_once(
              "design/README.md",
              '''The final UX-aligned desktop UI targets will live under:\n\n```text\ndesign/reference/visual-targets/\n```\n\nGenerated/hand-authored design targets express approved design intent. They must **not** be used directly as pixel-diff CI truth. Once the real implementation is semantically correct, accessible and accepted against the design target, browser screenshots from that implementation become the visual-regression goldens.\n\nCanonical standard desktop visual-target viewport: **1536 x 960**.''',
              '''The approved UX-aligned desktop UI targets live under:\n\n```text\ndesign/reference/visual-targets/\n```\n\nGenerated/hand-authored design targets express approved design intent. They must **not** be used directly as pixel-diff CI truth. Accepted browser screenshots from the real implementation live separately under:\n\n```text\ndesign/reference/visual-goldens/desktop-standard/\n```\n\nThe golden manifest records the exact source/build/browser identity from which each baseline was reviewed. Only a limited set of stable, high-value, target-backed surfaces belongs there; visual regression does not replace semantic journeys, accessibility checks or representative-user review.\n\nCanonical standard desktop visual-target and implementation-golden viewport: **1536 x 960**.''',
          )

          replace_once(
              "docs/workstreams/product-ux-ui-convergence.md",
              '| UXUI-10 | Built-product acceptance and browser goldens | UXUI-09 | READY |',
              '| UXUI-10 | Built-product acceptance and browser goldens | UXUI-09 | ACTIVE |',
          )
          replace_once(
              "docs/workstreams/product-ux-ui-convergence.md",
              '''Acceptance direction:\n\n- required exact-head repository, browser and built-product gates are green with no unresolved UXUI-09 regressions;''',
              '''Automated acceptance completed in this slice:\n\n- five reviewed implementation screenshots from an identified 1536x960 Chromium build are versioned under `design/reference/visual-goldens/desktop-standard/` with source/build provenance;\n- Browser Acceptance owns permanent pixel comparison for Overview, Test a model / frozen review, Benchmark Detail, Sample Evidence Detail and Campaign Results;\n- the golden set stays intentionally bounded and does not turn every product state into screenshot CI.\n\nRemaining acceptance direction:\n\n- required exact-head repository, browser and built-product gates remain green with no unresolved UXUI-09 regressions;''',
          )
          replace_once(
              "docs/workstreams/product-ux-ui-convergence.md",
              '1. UXUI-10 runs final assembled-product acceptance, closes visual-target gaps and captures approved implementation goldens.\n2. When acceptance evidence agrees with the UX contract, reconcile `docs/current-state.md` and close/delete this active workstream by default.',
              '1. UXUI-10 keeps the accepted implementation-golden regression gate green while the remaining manual compact/standard/wide accessibility and representative-user review is completed.\n2. When that human acceptance evidence agrees with the UX contract, reconcile `docs/current-state.md` and close/delete this active workstream by default.',
          )
          replace_once(
              "docs/workstreams/product-ux-ui-convergence.md",
              'Still required before final visual acceptance: Find best setup planning steps, Campaign Live, Runs history, Run Detail / Samples, Case Comparison Across Candidates, compatible/incompatible Compare states and failure/recovery states.',
              'Still required for final human visual/reference review: Find best setup planning steps, Campaign Live, Runs history, Run Detail / Samples, Case Comparison Across Candidates, compatible/incompatible Compare states and failure/recovery states. These states are not automatically added to the golden set; screenshot-sprawl remains a non-goal.',
          )

          replace_once(
              "docs/current-state.md",
              'The browser product now covers use-case-first planning, executable Campaign/results, benchmark/sample drill-down, same-case cross-candidate comparison and whole-product interaction hardening. Product UX/UI convergence advances to final built-product acceptance and implementation goldens. Representative-hardware evidence and the evidence-gated Local LLM Server evaluation cutover remain separate active work.',
              'The browser product now covers use-case-first planning, executable Campaign/results, benchmark/sample drill-down, same-case cross-candidate comparison and whole-product interaction hardening. Five stable high-value implementation screenshots are now versioned as provenance-bound browser goldens; Product UX/UI convergence remains active for the final manual accessibility/usability and representative-user review. Representative-hardware evidence and the evidence-gated Local LLM Server evaluation cutover remain separate active work.',
          )
          replace_once(
              "docs/current-state.md",
              'Shared product hardening now provides keyboard skip navigation, route-change focus restoration, assistive semantics for loading/error states, reduced-motion behavior and long technical-content containment. Browser evidence exercises recoverable failure, the supported 1024/1280/1600 desktop widths, extreme model/run/case identities, long case content and dense evaluator evidence without recreating backend semantics.',
              'Shared product hardening now provides keyboard skip navigation, route-change focus restoration, assistive semantics for loading/error states, reduced-motion behavior and long technical-content containment. Browser evidence exercises recoverable failure, the supported 1024/1280/1600 desktop widths, extreme model/run/case identities, long case content and dense evaluator evidence without recreating backend semantics. A separate 1536x960 golden gate protects Overview, frozen manual review, Benchmark Detail, Sample Evidence Detail and Campaign Results against unintended visual drift.',
          )
          replace_once(
              "docs/current-state.md",
              '| [Product UX/UI convergence](workstreams/product-ux-ui-convergence.md) | ACTIVE | UXUI-10 performs final built-product acceptance, manual accessibility/usability review where required and approved implementation goldens |',
              '| [Product UX/UI convergence](workstreams/product-ux-ui-convergence.md) | ACTIVE | UXUI-10 keeps built-product/browser goldens green while completing manual compact/standard/wide accessibility and representative-user review |',
          )
          replace_once(
              "docs/current-state.md",
              '`design/ux-contract.json` and `design/brand-kit.json` own durable experience truth; approved desktop targets under `design/reference/visual-targets/desktop-standard/` are design intent, not pixel-regression goldens.',
              '`design/ux-contract.json` and `design/brand-kit.json` own durable experience truth. Approved desktop targets under `design/reference/visual-targets/desktop-standard/` remain design intent; accepted implementation baselines under `design/reference/visual-goldens/desktop-standard/` are the limited pixel-regression truth and carry exact source/build provenance.',
          )
          replace_once(
              "docs/current-state.md",
              'UXUI-09 hardening is integrated at shared shell/state/foundation owners: keyboard focus remains visible and recoverable, loading/error feedback is announced semantically, reduced motion is respected and long evidence remains contained across compact/standard/wide desktop contexts. Manual assistive-technology/contrast review and reference-grade implementation screenshots remain UXUI-10 evidence rather than automated claims.',
              'UXUI-09 hardening is integrated at shared shell/state/foundation owners: keyboard focus remains visible and recoverable, loading/error feedback is announced semantically, reduced motion is respected and long evidence remains contained across compact/standard/wide desktop contexts. UXUI-10 now has automated implementation-golden evidence; manual assistive-technology/contrast review and representative-user/reference-grade acceptance remain explicit human evidence rather than automated claims.',
          )
          replace_once(
              "docs/current-state.md",
              '- UXUI-10 final built-product/manual accessibility/usability and approved implementation-golden evidence;',
              '- UXUI-10 manual compact/standard/wide assistive-technology/contrast and representative-user/reference-grade acceptance;',
          )
          PY
      - name: Remove temporary patch workflow and commit final text state
        shell: bash
        run: |
          rm .github/workflows/uxui10-finalize-text.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/visual-acceptance.spec.ts frontend/playwright.config.ts design/README.md design/ux-contract.json docs/current-state.md docs/workstreams/product-ux-ui-convergence.md .github/workflows/uxui10-finalize-text.yml
          git diff --cached --check
          git commit -m "Finalize UXUI-10 visual regression contracts"
          git push origin HEAD:agent/uxui-final-acceptance
