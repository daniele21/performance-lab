          )
          anchor = '## PVR-11 acceptance gate\n'
          note = '''## Representative-human theme correction\n\nThe product owner rejected the dark-only implementation as inconsistent with the approved desktop reference. This is a visual-system contract failure: `design/brand-kit.json` still declared dark-only and the executable tokens had no light theme. PVR-12 corrects the owning brand/theme contract rather than restyling individual pages.\n\nSettled direction: Light is canonical/default, Dark is optional, System follows the operating system, and the preference is browser-local product-owned UI state under Settings -> Appearance. All themes preserve the same task hierarchy and evidence semantics. The stable implementation goldens must be refreshed from the real light implementation and independently reproduced before automated visual acceptance returns to PASS.\n\n'''
          if anchor not in workstream:
              raise SystemExit('PVR-11 anchor missing')
          workstream = workstream.replace(anchor, note + anchor, 1)
          workstream_path.write_text(workstream)
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frozen frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Format changed text files
        run: |
          pnpm --dir frontend exec prettier --write \
            ../design/brand-kit.json \
            ../design/README.md \
            ../docs/workstreams/product-ux-ui-convergence.md \
            index.html \
            src/design/tokens.css \
            src/design/design-system.css \
            src/theme.ts \
            src/navigation.ts \
            src/routing.ts \
            src/pages/settings/SettingsPage.tsx \
            src/pages/settings/SettingsPage.test.tsx \
            src/pages/secondary.css \
            src/navigation.test.ts \
            src/routing.test.ts \
            e2e/cross-surface-integrity.spec.ts \
            e2e/appearance.spec.ts \
            e2e/visual-acceptance.spec.ts

      - name: Check, test and build frontend
        run: |
          pnpm --dir frontend run check
          pnpm --dir frontend run test
          pnpm --dir frontend run build

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            design/brand-kit.json \
            design/README.md \
            docs/workstreams/product-ux-ui-convergence.md \
            frontend/index.html \
            frontend/src/design/tokens.css \
            frontend/src/design/design-system.css \
            frontend/src/theme.ts \
            frontend/src/navigation.ts \
            frontend/src/routing.ts \
            frontend/src/pages/settings/SettingsPage.tsx \
            frontend/src/pages/settings/SettingsPage.test.tsx \
            frontend/src/pages/secondary.css \
            frontend/src/navigation.test.ts \
            frontend/src/routing.test.ts \
            frontend/e2e/cross-surface-integrity.spec.ts \
            frontend/e2e/appearance.spec.ts \
            frontend/e2e/visual-acceptance.spec.ts
          git commit -m "Add light-first theme and appearance preference"
          git push origin HEAD:feat/desktop-ux-hierarchy
