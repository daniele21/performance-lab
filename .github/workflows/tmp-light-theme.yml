          brand_path = Path('design/brand-kit.json')
          brand = json.loads(brand_path.read_text())
          brand['themes'] = {
              'default': 'light',
              'light': True,
              'dark': True,
              'system': True,
          }
          light_colors = {
              'surface': '#F6F8FA',
              'surface_elevated': '#FFFFFF',
              'surface_subtle': '#EFF2F5',
              'surface_raised': '#FFFFFF',
              'text_primary': '#171A1F',
              'text_secondary': '#5D6672',
              'text_tertiary': '#818B98',
              'primary': '#247F91',
              'secondary': '#6959D9',
              'quality': '#26899B',
              'performance': '#7059D6',
              'resources': '#3F78AD',
              'success': '#217A55',
              'warning': '#9A6317',
              'error': '#C44754',
              'evidence_unknown': '#707A86',
              'evidence_unavailable': '#A2A9B2',
              'border': '#D6DCE4',
              'border_subtle': '#E6EAF0',
              'border_strong': '#B9C2CE',
              'focus': '#176F80',
          }
          dark_colors = {
              'surface': '#080A0D',
              'surface_elevated': '#0E1116',
              'surface_subtle': '#141820',
              'surface_raised': '#191E27',
              'text_primary': '#F4F6F8',
              'text_secondary': '#A0A8B2',
              'text_tertiary': '#707A86',
              'primary': '#7DD6E8',
              'secondary': '#9A8CF7',
              'quality': '#67D5E3',
              'performance': '#A78BFA',
              'resources': '#7AB8F5',
              'success': '#4FD18B',
              'warning': '#E9B44C',
              'error': '#F06D78',
              'evidence_unknown': '#6F7782',
              'evidence_unavailable': '#484F58',
              'border': '#222831',
              'border_subtle': '#1A1F27',
              'border_strong': '#303844',
              'focus': '#9AE7F3',
          }
          brand['tokens']['colors'] = light_colors
          brand['tokens']['dark_colors'] = dark_colors
          brand['style']['direction'] = (
              'Precision Instrument: light-first, calm off-white workspace, neutral graphite text, '
              'evidence-first, high-density without visual noise; dark remains an optional user preference.'
