name: Temporary light theme implementation

on:
  push:
    branches:
      - feat/desktop-ux-hierarchy

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/desktop-ux-hierarchy

      - name: Apply light-first theme system
        env:
          SCRIPT_GZ_B64: ""
        run: echo "$SCRIPT_GZ_B64" | base64 --decode | gzip --decompress | python3

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frozen frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Format changed text files
        run: |
          pnpm --dir frontend exec prettier --write \
            ../design/brand-kit.json \
            ../design/README.md \
            ../docs/workstreams/product-ux-ui-convergence.md \
            index.html \
            src/design/tokens.css \
            src/design/design-system.css \
            src/theme.ts \
            src/navigation.ts \
            src/routing.ts \
            src/pages/settings/SettingsPage.tsx \
            src/pages/settings/SettingsPage.test.tsx \
            src/pages/secondary.css \
            src/navigation.test.ts \
            src/routing.test.ts \
            e2e/cross-surface-integrity.spec.ts \
            e2e/appearance.spec.ts \
            e2e/visual-acceptance.spec.ts

      - name: Check, test and build frontend
        run: |
          pnpm --dir frontend run check
          pnpm --dir frontend run test
          pnpm --dir frontend run build

      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-light-theme.yml
          git add design frontend docs/workstreams/product-ux-ui-convergence.md
          git commit -m "Add light-first theme and appearance preference"
          git push origin HEAD:feat/desktop-ux-hierarchy
