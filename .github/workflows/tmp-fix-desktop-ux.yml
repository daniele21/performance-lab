name: Temporary desktop UX TypeScript fix

on:
  push:
    branches:
      - feat/desktop-ux-hierarchy

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/desktop-ux-hierarchy

      - name: Apply null-safe target fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/find-best-setup/FindBestSetupPage.tsx')
          text = path.read_text()
          old = 'preview.target?.endpoint_identity ?? target.target.endpoint_identity'
          new = 'preview.target?.endpoint_identity ?? target?.target.endpoint_identity ?? "Unavailable"'
          if old not in text:
              raise SystemExit('expected target fallback not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Install frozen frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Format repaired file
        run: pnpm --dir frontend exec prettier --write src/pages/find-best-setup/FindBestSetupPage.tsx

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/find-best-setup/FindBestSetupPage.tsx
          git commit -m "Fix nullable target fallback in setup review"
          git push origin HEAD:feat/desktop-ux-hierarchy
