name: Repository health

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  adopted-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository structure
        run: python3 scripts/verify_repository.py
      - name: Verify product experience contract
        run: python3 scripts/verify_product_experience.py
      - name: Verify documentation lifecycle and budgets
        run: python3 scripts/verify_docs.py
      - name: Verify agent context budget
        run: python3 scripts/verify_agent_context.py

      # Intentionally not running scripts/verify_operations.py yet.
      # REL-UI-001 owns the still-missing build identity, immutable artifact
      # lifecycle, build-delta and final built-product cleanup guarantees.
      # Keep commands.json truthful/false until that implementation exists,
      # then enable the strict operating-contract gate in the same change.
