name: Temporary formatter helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  frontend-format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Format and commit canonical frontend output
        run: |
          pnpm --dir frontend exec prettier --write \
            e2e/evidence-drilldown.spec.ts \
            e2e/full-product.spec.ts \
            e2e/visual-acceptance.spec.ts
          if git diff --quiet -- \
            frontend/e2e/evidence-drilldown.spec.ts \
            frontend/e2e/full-product.spec.ts \
            frontend/e2e/visual-acceptance.spec.ts; then
            echo "Frontend files already match canonical Prettier output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/e2e/evidence-drilldown.spec.ts \
            frontend/e2e/full-product.spec.ts \
            frontend/e2e/visual-acceptance.spec.ts
          git commit -m "Format evidence UI E2E fixtures"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
