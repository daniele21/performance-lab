name: Temporary light-first golden refresh

on:
  push:
    branches:
      - feat/desktop-ux-hierarchy

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/desktop-ux-hierarchy

      - name: Record product source head
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frozen frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Check frontend
        run: pnpm --dir frontend run check

      - name: Test appearance contract
        run: pnpm --dir frontend exec playwright test e2e/appearance.spec.ts

      - name: Capture all stable light-first implementation goldens
        run: pnpm --dir frontend exec playwright test e2e/visual-acceptance.spec.ts --update-snapshots

      - name: Guard exact golden scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- design/reference/visual-goldens/desktop-standard | sort)"
          expected="$(printf '%s\n' \
            design/reference/visual-goldens/desktop-standard/benchmark-detail.png \
            design/reference/visual-goldens/desktop-standard/campaign-results.png \
            design/reference/visual-goldens/desktop-standard/overview.png \
            design/reference/visual-goldens/desktop-standard/sample-evidence-detail.png \
            design/reference/visual-goldens/desktop-standard/test-a-model-review.png | sort)"
          echo "Changed goldens:"
          echo "$changed"
          if [[ "$changed" != "$expected" ]]; then
            echo "Golden refresh scope did not match the five stable light-first surfaces." >&2
            echo "Expected:" >&2
            echo "$expected" >&2
            exit 1
          fi

      - name: Upload candidate light-first goldens
        id: capture
        uses: actions/upload-artifact@v4
        with:
          name: light-first-golden-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            design/reference/visual-goldens/desktop-standard/benchmark-detail.png
            design/reference/visual-goldens/desktop-standard/campaign-results.png
            design/reference/visual-goldens/desktop-standard/overview.png
            design/reference/visual-goldens/desktop-standard/sample-evidence-detail.png
            design/reference/visual-goldens/desktop-standard/test-a-model-review.png
          retention-days: 7

      - name: Update candidate manifest
        env:
          SOURCE_HEAD: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.capture.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.capture.outputs.artifact-digest }}
          ARTIFACT_NAME: light-first-golden-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path('design/reference/visual-goldens/desktop-standard')
          path = root / 'manifest.json'
          manifest = json.loads(path.read_text())
          manifest['status'] = 'candidate-light-first-automated-visual-regression-baseline'
          manifest['capture'] = {
              'source_head_sha': os.environ['SOURCE_HEAD'],
              'browser_capture_run_id': int(os.environ['RUN_ID']),
              'artifact_id': int(os.environ['ARTIFACT_ID']),
              'artifact_name': os.environ['ARTIFACT_NAME'],
              'artifact_sha256': os.environ['ARTIFACT_DIGEST'].removeprefix('sha256:'),
              'platform': 'GitHub-hosted Ubuntu 24.04',
              'locale': 'en-US',
              'timezone': 'UTC',
              'os_color_scheme': 'dark',
              'product_theme': 'light',
              'reduced_motion': 'reduce',
          }
          manifest.pop('acceptance', None)
          manifest['review'] = {
              'method': 'real Playwright implementation capture; independent Browser Acceptance reproduction pending',
              'decision': 'candidate pending independent CI match',
              'human_reference_grade_claim': False,
          }
          manifest['design_target_root'] = 'design/ux-contract.json + design/brand-kit.json'
          for entry in manifest['goldens'].values():
              data = (root / entry['file']).read_bytes()
              entry['sha256'] = hashlib.sha256(data).hexdigest()
          manifest['scope_note'] = (
              'These five stable automated visual-regression surfaces were refreshed from the real implementation '
              'after Light became the canonical default theme. Capture intentionally used an OS-dark browser context '
              'while the product rendered Light, proving that default product appearance is independent of OS theme '
              'until the user selects System. Independent Browser Acceptance must reproduce this baseline without '
              'snapshot updates. This does not substitute for representative-human accessibility/usability review.'
          )
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Commit bounded candidate and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-refresh-light-goldens.yml
          git add \
            design/reference/visual-goldens/desktop-standard/benchmark-detail.png \
            design/reference/visual-goldens/desktop-standard/campaign-results.png \
            design/reference/visual-goldens/desktop-standard/overview.png \
            design/reference/visual-goldens/desktop-standard/sample-evidence-detail.png \
            design/reference/visual-goldens/desktop-standard/test-a-model-review.png \
            design/reference/visual-goldens/desktop-standard/manifest.json
          git commit -m "Refresh light-first implementation goldens"
          git push origin HEAD:feat/desktop-ux-hierarchy
