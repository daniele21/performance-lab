name: UIA003 query template patch

on:
  push:
    branches: [agent/uia-003-ui-composition-root]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve local run template in canonical preflight
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/performance_lab/application/ui_queries.py')
          text = path.read_text()
          old = '''        dataset_snapshots: tuple[DatasetSnapshot, ...] = (),\n        baselines: tuple[BaselineBinding, ...] = (),\n        policies: tuple[RegressionPolicy, ...] = (),\n    ) -> None:\n'''
          new = '''        dataset_snapshots: tuple[DatasetSnapshot, ...] = (),\n        baselines: tuple[BaselineBinding, ...] = (),\n        policies: tuple[RegressionPolicy, ...] = (),\n        starter_run_template: StarterRunConfig | None = None,\n    ) -> None:\n'''
          if old not in text:
              raise SystemExit('UIQueryService init signature anchor not found')
          text = text.replace(old, new, 1)

          old = '''        self.baselines = baselines\n        self.policies = policies\n        self.comparisons = RunComparisonService(store)\n'''
          new = '''        self.baselines = baselines\n        self.policies = policies\n        self.starter_run_template = starter_run_template\n        self.comparisons = RunComparisonService(store)\n'''
          if old not in text:
              raise SystemExit('UIQueryService assignment anchor not found')
          text = text.replace(old, new, 1)

          old = '''        config = StarterRunConfig(\n            target_id=target.target_id,\n            endpoint_identity=target.endpoint_identity,\n            endpoint=endpoint,\n            model_id=request.model_id,\n            use_host_telemetry=request.use_host_telemetry,\n            suite_id="general-diagnostic-starter",\n        )\n'''
          new = '''        template = (\n            self.starter_run_template.model_dump(mode="python")\n            if self.starter_run_template is not None\n            else {}\n        )\n        config = StarterRunConfig.model_validate(\n            {\n                **template,\n                "target_id": target.target_id,\n                "endpoint_identity": target.endpoint_identity,\n                "endpoint": endpoint,\n                "model_id": request.model_id,\n                "run_id": None,\n                "use_host_telemetry": request.use_host_telemetry,\n                "suite_id": "general-diagnostic-starter",\n            }\n        )\n'''
          if old not in text:
              raise SystemExit('preflight config anchor not found')
          path.write_text(text)
          PY
          git rm .github/workflows/uia003-query-template-patch.yml
      - name: Commit focused patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/performance_lab/application/ui_queries.py
          git commit -m "UIA-003 preserve local execution template in preflight"
          git push origin "HEAD:${GITHUB_REF_NAME}"
