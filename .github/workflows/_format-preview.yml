name: Temporary frontend format preview

on:
  pull_request:
  push:
    branches: [agent/ui-006-library-settings]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.17.0
      - run: npm --prefix frontend ci
      - name: Print canonical Prettier diff
        shell: bash
        run: |
          npm --prefix frontend exec prettier -- --write src/api/types.ts src/components/AppShell.tsx src/pages/library/LibraryPage.tsx src/pages/settings/SettingsPage.tsx
          git diff -- frontend/src/api/types.ts frontend/src/components/AppShell.tsx frontend/src/pages/library/LibraryPage.tsx frontend/src/pages/settings/SettingsPage.tsx
