name: Browser acceptance

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Install frozen frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Check frontend
        run: npm --prefix frontend run check
      - name: Test frontend components
        run: npm --prefix frontend run test
      - name: Run critical browser journeys
        run: npm --prefix frontend run test:e2e
      - name: Upload bounded browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
