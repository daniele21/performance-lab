name: Browser acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Ref to validate
        default: dev
        type: string

permissions:
  contents: read

jobs:
  playwright:
    name: Manual Playwright acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend run check && pnpm --dir frontend run test && pnpm --dir frontend run test:e2e
      - run: uv run --no-project python scripts/verify_e2e_media.py frontend/test-results/results.json J0 J1 J2 J3 J4 J5 J6 J7 J8 J9
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
