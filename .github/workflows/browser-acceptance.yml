name: Browser acceptance

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  scope:
    name: Select validation profile
    runs-on: ubuntu-latest
    outputs:
      run_browser_e2e: ${{ steps.selector.outputs.run_browser_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: selector
        name: Resolve blast radius
        shell: bash
        run: |
          args=(
            --base "${{ github.event.pull_request.base.sha }}"
            --head "${{ github.event.pull_request.head.sha }}"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            args+=(--promotion)
          fi
          python scripts/select_validation_profile.py "${args[@]}"

  playwright:
    name: Playwright (Chromium)
    needs: scope
    if: needs.scope.outputs.run_browser_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Install frozen frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Check frontend
        run: npm --prefix frontend run check
      - name: Test frontend components
        run: npm --prefix frontend run test
      - name: Run critical browser journeys
        run: npm --prefix frontend run test:e2e
      - name: Upload bounded browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
