name: UI004 format bootstrap

on:
  push:
    branches: [agent/ui-004-live-run]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Install frozen frontend dependencies
        run: npm --prefix frontend ci
      - name: Apply canonical Prettier formatting
        working-directory: frontend
        run: npm exec prettier -- --write src/api/types.ts src/App.tsx src/pages/live-run/LiveRunPage.tsx src/pages/test-model/TestModelPage.tsx
      - name: Remove bootstrap and commit
        shell: bash
        run: |
          git rm .github/workflows/ui004-format-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src
          git commit -m "UI-004 apply canonical frontend formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
