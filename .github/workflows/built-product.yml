name: Built product

on:
  pull_request:
    branches: [main, dev]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  scope:
    name: Select validation profile
    runs-on: ubuntu-latest
    outputs:
      run_built_product: ${{ steps.selector.outputs.run_built_product }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: selector
        name: Resolve blast radius
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            args=(
              --base "${{ github.event.pull_request.base.sha }}"
              --head "${{ github.event.pull_request.head.sha }}"
              --github-output "$GITHUB_OUTPUT"
            )
            if [[ "${{ github.base_ref }}" == "main" ]]; then
              args+=(--promotion)
            fi
            python scripts/select_validation_profile.py "${args[@]}"
          else
            python scripts/select_validation_profile.py --full --github-output "$GITHUB_OUTPUT"
          fi

  built-product:
    name: Build, pre-real E2E, smoke, full-product E2E, package
    needs: scope
    if: needs.scope.outputs.run_built_product == 'true'
    runs-on: ubuntu-latest
    env:
      PERFORMANCE_LAB_BUILD_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      PERFORMANCE_LAB_VARIANT: browser-ui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Select artifact channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "PERFORMANCE_LAB_CHANNEL=release" >> "$GITHUB_ENV"
          else
            echo "PERFORMANCE_LAB_CHANNEL=ci" >> "$GITHUB_ENV"
          fi
      - name: Restore comparable build history
        uses: actions/cache/restore@v4
        with:
          path: build/artifacts
          key: performance-lab-build-history-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            performance-lab-build-history-${{ runner.os }}-${{ runner.arch }}-
      - name: Install constrained Python dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-constraints.txt -e ".[dev]"
      - name: Install frozen frontend dependencies
        run: |
          npm install --global npm@11.17.0
          npm --prefix frontend ci
      - name: Install Chromium
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Validate dependency snapshot
        run: python scripts/validate_ci_constraints.py requirements/ci-constraints.txt
      - name: Validate Python repository
        run: python scripts/validate.py
      - name: Validate frontend
        run: |
          npm --prefix frontend run check
          npm --prefix frontend run test
      - name: Validate deterministic product journey
        run: python -m pytest tests/e2e -v --tb=short
      - name: Run pre-real browser J0-J9 with retained evidence
        run: python scripts/pre_real_e2e.py --output-root build/pre-real-e2e
      - name: Build, smoke, run packaged J0/J1/J8/J9 and atomically publish local artifact
        run: python scripts/package_release.py --validated --require-full-product-e2e
      - name: Finalize pre-real readiness verdict
        run: |
          python scripts/finalize_pre_real_e2e.py \
            --browser-manifest build/pre-real-e2e/browser-manifest.json \
            --packaged-report frontend/test-results-full-product/report.json \
            --output-root build/pre-real-e2e
      - name: Verify operating and E2E contracts are enforced
        run: |
          python scripts/verify_operations.py
          python scripts/verify_e2e.py
      - name: Save successful comparable build history
        uses: actions/cache/save@v4
        with:
          path: build/artifacts
          key: performance-lab-build-history-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload bounded built-product evidence
        uses: actions/upload-artifact@v4
        with:
          name: performance-lab-built-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/artifacts/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload bounded pre-real E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-real-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pre-real-e2e/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload bounded packaged E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results-full-product/**
          if-no-files-found: ignore
          retention-days: 7
