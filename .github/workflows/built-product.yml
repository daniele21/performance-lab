name: Built product

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Ref to build and validate
        default: dev
        type: string

permissions:
  contents: read

jobs:
  built-product:
    name: Build, pre-real E2E, smoke, full-product E2E, package
    runs-on: ubuntu-latest
    env:
      PERFORMANCE_LAB_BUILD_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      PERFORMANCE_LAB_VARIANT: browser-ui
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Select artifact channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "PERFORMANCE_LAB_CHANNEL=release" >> "$GITHUB_ENV"; else echo "PERFORMANCE_LAB_CHANNEL=manual" >> "$GITHUB_ENV"; fi
      - uses: actions/cache/restore@v4
        with:
          path: build/artifacts
          key: performance-lab-build-history-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: performance-lab-build-history-${{ runner.os }}-${{ runner.arch }}-
      - run: uv sync --extra dev --locked
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: uv run --extra dev --locked python scripts/validate.py
      - run: pnpm --dir frontend run check && pnpm --dir frontend run test
      - run: uv run --extra dev --locked python -m pytest tests/e2e -v --tb=short
      - run: uv run --extra dev --locked python scripts/pre_real_e2e.py --output-root build/pre-real-e2e
      - run: uv run --extra dev --locked python scripts/verify_e2e_media.py build/pre-real-e2e/playwright-report.json J0 J1 J2 J3 J4 J5 J6 J7 J8 J9
      - run: uv run --extra dev --locked python scripts/package_release.py --validated --require-full-product-e2e
      - run: uv run --extra dev --locked python scripts/verify_e2e_media.py frontend/test-results-full-product/report.json J0 J1 J8 J9
      - run: uv run --extra dev --locked python scripts/finalize_pre_real_e2e.py --browser-manifest build/pre-real-e2e/browser-manifest.json --packaged-report frontend/test-results-full-product/report.json --output-root build/pre-real-e2e
      - uses: actions/cache/save@v4
        with:
          path: build/artifacts
          key: performance-lab-build-history-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-lab-built-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/artifacts/**
          if-no-files-found: error
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-real-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pre-real-e2e/**
          if-no-files-found: error
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results-full-product/**
          if-no-files-found: error
          retention-days: 7
