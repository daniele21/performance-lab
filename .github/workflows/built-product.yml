name: Built product

on:
  pull_request:
    branches: [main, dev]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  built-product:
    name: Build, smoke, package
    runs-on: ubuntu-latest
    env:
      PERFORMANCE_LAB_BUILD_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      PERFORMANCE_LAB_VARIANT: browser-ui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Select artifact channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "PERFORMANCE_LAB_CHANNEL=release" >> "$GITHUB_ENV"
          else
            echo "PERFORMANCE_LAB_CHANNEL=ci" >> "$GITHUB_ENV"
          fi
      - name: Restore comparable build history
        uses: actions/cache/restore@v4
        with:
          path: build/artifacts
          key: performance-lab-build-history-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            performance-lab-build-history-${{ runner.os }}-${{ runner.arch }}-
      - name: Install constrained Python dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-constraints.txt -e ".[dev]"
      - name: Install frozen frontend dependencies
        run: |
          npm install --global npm@11.17.0
          npm --prefix frontend ci
      - name: Validate dependency snapshot
        run: python scripts/validate_ci_constraints.py requirements/ci-constraints.txt
      - name: Validate Python repository
        run: python scripts/validate.py
      - name: Validate frontend
        run: |
          npm --prefix frontend run check
          npm --prefix frontend run test
      - name: Validate deterministic product journey
        run: python -m pytest tests/e2e -v --tb=short
      - name: Build, smoke and atomically publish local artifact
        run: python scripts/package_release.py --validated
      - name: Verify operating contract is now enforced
        run: python scripts/verify_operations.py
      - name: Save successful comparable build history
        uses: actions/cache/save@v4
        with:
          path: build/artifacts
          key: performance-lab-build-history-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload bounded built-product evidence
        uses: actions/upload-artifact@v4
        with:
          name: performance-lab-built-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/artifacts/**
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish immutable GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: built-product
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: performance-lab-built-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifact
      - name: Create release without clobbering existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t files < <(find release-artifact -type f -print | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release files found" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Performance Lab $GITHUB_REF_NAME"
